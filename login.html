<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Admin Login</title>

    <style>

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: linear-gradient(135deg, #667eea, #764ba2, #ec4899);

        }

        .login-box {

            background: white;

            width: 350px;

            max-width: 90%;

            padding: 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow: 0 12px 35px rgba(0,0,0,0.25);

        }

        .logo {

            font-size: 45px;

        }

        h2 {

            color: #5b21b6;

        }

        p {

            color: #64748b;

        }

        input {

            width: 100%;

            padding: 13px;

            margin: 10px 0;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            color: white;

            font-weight: bold;

            background: linear-gradient(90deg, #6366f1, #a855f7);

            cursor: pointer;

        }

        button:hover {

            opacity: 0.85;

        }

        .error {

            color: red;

        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">💰</div>

        <h2>Smart Expense Tracker</h2>

        <p>Admin Login Portal</p>

        {% if error %}

        <p class="error">{{ error }}</p>

        {% endif %}

        <form action="/login" method="POST">

            <input type="text" name="username"

                   placeholder="Admin Username" required>

            <input type="password" name="password"

                   placeholder="Password" required>

            <button type="submit">LOGIN</button>

        </form>

    </div>

</body>

</html>
